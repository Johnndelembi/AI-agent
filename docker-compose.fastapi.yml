version: '3.8'

services:
  ai-agent-api:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: ai-agent-api
    ports:
      - "8000:8000"
    environment:
      - CHATBOT_MODEL=${CHATBOT_MODEL:-openai:gpt-4}
      - CHATBOT_API_KEY=${CHATBOT_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - TTS_VOICE=${TTS_VOICE:-af_heart}
      - TTS_LANG_CODE=${TTS_LANG_CODE:-b}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_PASSWORD=${SENDER_PASSWORD}
      - ENV=${ENV:-production}
      - DEBUG=${DEBUG:-false}
    volumes:
      - ./audio_output:/app/audio_output
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-agent-network

  # Optional: Add Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: ai-agent-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped
  #   networks:
  #     - ai-agent-network

networks:
  ai-agent-network:
    driver: bridge


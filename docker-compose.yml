
services:
  # MongoDB - Primary database
  mongo:
    image: mongo:7
    container_name: ai-agent-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ai-agent-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis - Message broker and result backend for Celery
  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - ai-agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # FastAPI Web Server
  api:
    build: .
    container_name: ai-agent-api
    ports:
      - "8001:8000"
    environment:
      # API Keys - Set these in your .env file or override here
      - CHATBOT_API_KEY=${CHATBOT_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # Model configuration
      - CHATBOT_MODEL=${CHATBOT_MODEL:-openai:gpt-4}
      # Environment
      - ENV=${ENV:-production}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # MongoDB Configuration
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/}
      - DATABASE_NAME=${DATABASE_NAME:-test-db-retry}
      # JWT Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-secret-key-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # Email Configuration
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_PASSWORD=${SENDER_PASSWORD}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - APP_NAME=${APP_NAME:-Artemis AI Assistant}
      # TTS Configuration
      - TTS_VOICE=${TTS_VOICE:-af_heart}
      - TTS_LANG_CODE=${TTS_LANG_CODE:-b}
      # LangSmith (optional)
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-ai_agent}
      # Celery/Redis Configuration
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      # Mount for persistent data, logs, and audio output
      - ./data:/app/data
      - ./logs:/app/logs
      - ./audio_output:/app/audio_output
    networks:
      - ai-agent-network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Memory limits to prevent OOM kills during TTS model loading
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 3660s
      timeout: 10s
      retries: 2
      start_period: 120s

  # Celery Worker - Handles CPU-intensive and background tasks
  celery_worker:
    build: .
    container_name: ai-agent-celery-worker
    environment:
      # API Keys
      - CHATBOT_API_KEY=${CHATBOT_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - CHATBOT_MODEL=${CHATBOT_MODEL:-openai:gpt-4}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # MongoDB Configuration
      - MONGO_URI=${MONGO_URI}
      - DATABASE_NAME=${DATABASE_NAME:-test-db-retry}
      # Celery/Redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./audio_output:/app/audio_output
    networks:
      - ai-agent-network
    depends_on:
      redis:
        condition: service_healthy
    # Single worker to prevent memory issues with TTS tasks
    # Worker restarts after 3 tasks to prevent memory leaks
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1 --max-tasks-per-child=3 --queues=default,cpu_intensive,io_bound,priority
    # Memory limits to prevent OOM kills
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Beat - Periodic task scheduler
  celery_beat:
    build: .
    container_name: ai-agent-celery-beat
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
    networks:
      - ai-agent-network
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.celery_app beat --loglevel=info
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai-agent-network:
    driver: bridge
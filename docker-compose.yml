version: '3.8'

services:
  api:
    build: .
    container_name: ai-agent-api
    ports:
      - "8000:8000"
    environment:
      # API Keys - Set these in your .env file or override here
      - CHATBOT_API_KEY=${CHATBOT_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # Model configuration
      - CHATBOT_MODEL=${CHATBOT_MODEL:-openai:gpt-4}
      # Environment
      - ENV=${ENV:-production}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - REDIS_URL=redis://redis:6379/0
      # LinkedIn API (optional)
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
    volumes:
      # Mount for persistent data and logs
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    # No healthcheck to keep only one API endpoint (/message)
    networks:
      - ai-agent-network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ai-agent-network

networks:
  ai-agent-network:
    driver: bridge

volumes:
  redis_data:
# version: '3.8'

services:
  # MongoDB - Primary database
  mongo:
    image: mongo:7
    container_name: ai-agent-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ai-agent-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis - Message broker and result backend for Celery
  redis:
    image: redis:7-alpine
    container_name: ai-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - ai-agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # FastAPI Web Server
  api:
    build: .
    container_name: ai-agent-api
    ports:
      - "8000:8000"
    environment:
      # API Keys - Set these in your .env file or override here
      - CHATBOT_API_KEY=${CHATBOT_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Model configuration
      - CHATBOT_MODEL=${CHATBOT_MODEL:-openai:gpt-4}
      # Environment
      - ENV=${ENV:-production}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # MongoDB Configuration
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/}
      - DATABASE_NAME=${DATABASE_NAME:-test-db-retry}
      - MIPANGO_DATABASE=${MIPANGO_DATABASE}
      # JWT Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-secret-key-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # Email Configuration
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_PASSWORD=${SENDER_PASSWORD}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - APP_NAME=${APP_NAME:-Artemis AI Assistant}
      # LangSmith (optional)
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-ai_agent}
      # Celery/Redis Configuration
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      # Mount for persistent data, logs, and audio output
      - ./data:/app/data
      - ./logs:/app/logs
      - ./audio_output:/app/audio_output
    networks:
      - ai-agent-network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai-agent-network:
    driver: bridge